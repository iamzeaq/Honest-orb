<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Honest Orb — Know your rights</title>
<meta name="description" content="Tap the orb, ask in your own words, and hear your rights during police encounters. Information, not legal advice.">
<meta name="theme-color" content="#0a0a0a">
<link rel="manifest" href="/manifest.webmanifest">
<link rel="icon" type="image/svg+xml" href="/icon.svg">
<link rel="apple-touch-icon" href="/icon-192.png">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Honest Orb">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/style.css?v=3">
</head>
<body>
<header class="wordmark">Honest&nbsp;Orb</header>
<p class="tagline">your legal companion</p>

<main class="stage">
  <button id="orbButton" class="orb-button" aria-label="Tap and talk" aria-pressed="false">
    <canvas id="orbCanvas" width="512" height="512" aria-hidden="true"></canvas>
    <div id="orbFallback" class="orb-fallback" aria-hidden="true"></div>
  </button>
  <p id="orbLine" class="orb-line" role="status" aria-live="polite">Tap to talk</p>
  <button id="detailsButton" class="type-toggle" hidden>Show details</button>
  <p id="orbError" class="orb-error" hidden></p>
  <p id="voiceNote" class="voice-note" hidden></p>
  <button id="typeToggle" class="type-toggle">Type instead</button>
  <button id="thinkMute" class="type-toggle" aria-label="Toggle thinking sound" aria-pressed="true">♪</button>
  <a id="emergencyCall" class="emergency-call" href="tel:112" hidden>Call 112</a>
  <form id="typeForm" class="type-form" hidden>
    <input id="typeInput" type="text" enterkeyhint="send" maxlength="500"
           placeholder="e.g. Can police search my phone?" aria-label="Type your question">
    <button type="submit" aria-label="Send">→</button>
  </form>
</main>

<section id="card" class="card" hidden aria-live="polite">
  <div id="cardHandle" class="card-handle" aria-hidden="true"></div>
  <a id="callButton" class="call-button" href="tel:112" hidden>Call 112</a>
  <h2 id="cardRight" class="card-right"></h2>
  <p class="card-row"><span class="card-label">Say this</span><span id="cardSay"></span></p>
  <p class="card-row"><span class="card-label">Do this</span><span id="cardDo"></span></p>
  <div id="cardCites" class="card-cites"></div>
</section>
<div id="scrim" class="scrim" hidden></div>

<footer class="footer">Information, not legal advice · Emergency 112</footer>

<script src="/orb.js?v=3" defer></script>
<script src="/app.js?v=3" defer></script>
</body>
</html>
